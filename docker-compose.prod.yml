version: "3.9"

services:

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-chatdb}
      POSTGRES_USER: ${DB_USER:-chatuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chat_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - redis_data:/data
    networks:
      - chat_network

  backend:
    image: chat-backend:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      DEBUG: "${DEBUG:-False}"
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-api.mydomain.com}
    networks:
      - chat_network

  frontend:
    image: chat-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.mydomain.com}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.mydomain.com}
    networks:
      - chat_network

volumes:
  postgres_data:
  redis_data:

networks:
  chat_network: